name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing KEYSTORE_BASE64 or KEYSTORE_PASSWORD secret. Add both under Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=opencalltracker"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Check format
        run: ./gradlew spotlessCheck

      - name: Build signed release APK
        run: ./gradlew assembleRelease

      - name: Name the APK after the version
        run: |
          VERSION_NAME=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk "artifact/OpenCallTracker-${VERSION_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: OpenCallTracker-apk
          path: artifact/*.apk
          if-no-files-found: error
